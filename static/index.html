<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tetris · Rust</title>
<style>
  body { margin: 0; min-height: 100vh; background: #0d0d12; color: #e6e6e6; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; }
  #wrap { display: flex; gap: 24px; align-items: flex-start; }
  #board { background: #050508; border: 2px solid #2a2a35; box-shadow: 0 0 40px #0006; }
  .side { display: flex; flex-direction: column; gap: 14px; width: 160px; }
  .box { background: #16161e; border: 1px solid #2a2a35; border-radius: 8px; padding: 10px; }
  .box h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: 1.5px; color: #7a7a8c; text-transform: uppercase; font-weight: 600; }
  canvas.mini { display: block; background: #050508; border-radius: 4px; }
  .val { font-size: 24px; font-variant-numeric: tabular-nums; }
  #status { font-size: 12px; color: #7a7a8c; min-height: 16px; }
  .help { font-size: 12px; color: #7a7a8c; line-height: 1.8; }
  kbd { background: #222230; border: 1px solid #343446; border-radius: 3px; padding: 0 4px; font-family: inherit; color: #bbb; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="board" width="300" height="600"></canvas>
  <div class="side">
    <div class="box"><h3>Hold</h3><canvas class="mini" id="hold" width="120" height="90"></canvas></div>
    <div class="box"><h3>Next</h3><canvas class="mini" id="next" width="120" height="90"></canvas></div>
    <div class="box"><h3>Счёт</h3><div class="val" id="score">0</div></div>
    <div class="box"><h3>Линии</h3><div class="val" id="lines">0</div></div>
    <div class="box"><h3>Уровень</h3><div class="val" id="level">1</div></div>
    <div class="help">
      <kbd>←</kbd> <kbd>→</kbd> сдвиг<br>
      <kbd>↑</kbd> / <kbd>X</kbd> поворот<br>
      <kbd>↓</kbd> мягкое падение<br>
      <kbd>Space</kbd> жёсткое<br>
      <kbd>C</kbd> hold<br>
      <kbd>R</kbd> новая игра
    </div>
    <div id="status">подключение…</div>
  </div>
</div>
<script>
// Цвета фигур: I O T S Z J L — каждый человечек окрашен в цвет своей фигуры.
const COLORS = [null, '#22d3ee', '#facc15', '#a855f7', '#22c55e', '#ef4444', '#3b82f6', '#f97316'];
const CELL = 30;
const $ = id => document.getElementById(id);
const boardCtx = $('board').getContext('2d');
const holdCtx = $('hold').getContext('2d');
const nextCtx = $('next').getContext('2d');
let ws = null;
let state = null;

// Внешность тела выводится из его параметров хешем, а не случайным числом:
// при перерисовке 60 раз в секунду тело не должно мерцать.
function hash(a, b, c) {
  let h = (a * 374761393 + b * 668265263 + c * 2246822519) | 0;
  h = (h ^ (h >>> 13)) * 1274126177;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

const HAIR = ['#2b2119', '#4a2f1b', '#6b4423', '#8b5a2b', '#1c1c22', '#5a3a22', '#3a2a3a'];
const SKIN = ['#f2c9a0', '#e0ac7e', '#c68863', '#a06a45', '#7d4f30'];

// Одна фигура — одно тело. Клетки становятся суставами: позвоночник идёт по
// самой длинной цепочке, всё остальное — конечности. Позвоночник красим в цвет
// фигуры, конечности в цвет кожи, поэтому тело читается как тело.
function bodyParts(cells) {
  if (cells.length === 1) return { spine: cells.slice(), arms: [], legs: [], head: cells[0], tail: cells[0] };

  const key = c => c[0] + ',' + c[1];
  const index = new Map(cells.map((c, i) => [key(c), i]));

  const adj = cells.map(() => []);
  cells.forEach(([x, y], i) => {
    [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
      const j = index.get((x + dx) + ',' + (y + dy));
      if (j !== undefined) adj[i].push(j);
    });
  });

  // корень — самая верхняя клетка, из неё считаем глубины
  let root = 0;
  cells.forEach(([x, y], i) => {
    const [rx, ry] = cells[root];
    if (y < ry || (y === ry && x < rx)) root = i;
  });

  const parent = new Array(cells.length).fill(-1);
  const depth = new Array(cells.length).fill(-1);
  const queue = [root];
  depth[root] = 0;
  const order = [];
  while (queue.length) {
    const i = queue.shift();
    order.push(i);
    adj[i].forEach(j => {
      if (depth[j] === -1) {
        depth[j] = depth[i] + 1;
        parent[j] = i;
        queue.push(j);
      }
    });
  }

  // низ — самая глубокая клетка, до неё и есть позвоночник
  let bottom = root;
  order.forEach(i => {
    const [bx, by] = cells[bottom];
    const [x, y] = cells[i];
    if (depth[i] > depth[bottom] || (depth[i] === depth[bottom] && (y > by || (y === by && x > bx)))) bottom = i;
  });

  const spineIdx = [];
  for (let i = bottom; i !== -1; i = parent[i]) spineIdx.push(i);
  spineIdx.reverse();

  const spineSet = new Set(spineIdx);
  const spineEdges = new Set();
  for (let k = 0; k + 1 < spineIdx.length; k++) {
    spineEdges.add(spineIdx[k] + '-' + spineIdx[k + 1]);
    spineEdges.add(spineIdx[k + 1] + '-' + spineIdx[k]);
  }

  const arms = [];
  const legs = [];
  order.forEach(i => {
    const p = parent[i];
    if (p === -1) return;
    if (spineSet.has(i) && spineEdges.has(p + '-' + i)) return;
    // отросток ниже середины позвоночника считаем ногой
    const half = Math.floor(spineIdx.length / 2);
    const branchAt = spineIdx.indexOf(p);
    const limb = [p, i];
    if (branchAt >= half) legs.push(limb);
    else arms.push(limb);
  });

  return { spine: spineIdx, arms, legs, head: root, tail: bottom };
}

function jointPoint(cells, i, size) {
  const [x, y] = cells[i];
  return [x * size + size / 2, y * size + size / 2];
}

// Одно тело на фигуру: кости по суставам, голова сверху, конечности в стороны.
function drawBody(ctx, cells, size, color, alpha = 1, seed = 0, bounds = null) {
  if (!cells.length) return;
  const parts = bodyParts(cells);
  const r1 = hash(cells.length, seed, 1);
  const r2 = hash(cells.length, seed, 2);

  const skin = SKIN[Math.floor(r1 * SKIN.length) % SKIN.length];
  const hair = HAIR[Math.floor(r2 * HAIR.length) % HAIR.length];

  ctx.globalAlpha = alpha;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // позвоночник — толстая кость в цвет фигуры
  ctx.strokeStyle = color;
  ctx.lineWidth = size * 0.34;
  for (let k = 0; k + 1 < parts.spine.length; k++) {
    const a = jointPoint(cells, parts.spine[k], size);
    const b = jointPoint(cells, parts.spine[k + 1], size);
    ctx.beginPath();
    ctx.moveTo(a[0], a[1]);
    ctx.lineTo(b[0], b[1]);
    ctx.stroke();
  }

  // конечности — тонкие, телесного цвета
  ctx.strokeStyle = skin;
  ctx.lineWidth = size * 0.17;
  [...parts.arms, ...parts.legs].forEach(([from, to]) => {
    const a = jointPoint(cells, from, size);
    const b = jointPoint(cells, to, size);
    // выносим кисть чуть дальше сустава, чтобы рука не обрубалась в клетке
    const dx = b[0] - a[0];
    const dy = b[1] - a[1];
    const len = Math.hypot(dx, dy) || 1;
    const ex = b[0] + (dx / len) * size * 0.22;
    const ey = b[1] + (dy / len) * size * 0.22;
    ctx.beginPath();
    ctx.moveTo(a[0], a[1]);
    ctx.lineTo(ex, ey);
    ctx.stroke();
  });

  // голова — за верхним суставом, наружу от шеи
  const headAt = jointPoint(cells, parts.head, size);
  let hx = 0;
  let hy = -1;
  if (parts.spine.length > 1) {
    const next = jointPoint(cells, parts.spine[1], size);
    hx = headAt[0] - next[0];
    hy = headAt[1] - next[1];
    const d = Math.hypot(hx, hy) || 1;
    hx /= d; hy /= d;
  }
  const headR = size * (0.32 + r1 * 0.06);
  // Границы поля: у превью холст маленький, а рисование смещено, поэтому
  // сравнивать с шириной холста нельзя — границы передаём явно.
  const minX = bounds ? bounds[0] : 0;
  const maxX = bounds ? bounds[1] : (ctx.canvas ? ctx.canvas.width : Infinity);

  // Голова выносится наружу от шеи. Если по эту сторону стена — разворачиваем
  // голову внутрь, иначе она уедет за край поля и обрежется.
  let headCx = headAt[0] + hx * headR * 0.9;
  let headCy = headAt[1] + hy * headR * 0.9;
  if (headCx - headR < minX || headCx + headR > maxX) {
    headCx = headAt[0] - hx * headR * 0.9;
    headCy = headAt[1] - hy * headR * 0.9;
  }
  headCy = Math.max(headCy, headR);

  ctx.strokeStyle = skin;
  ctx.lineWidth = size * 0.17;
  ctx.beginPath();
  ctx.moveTo(headAt[0], headAt[1]);
  ctx.lineTo(headCx, headCy);
  ctx.stroke();

  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.arc(headCx, headCy, headR, 0, Math.PI * 2);
  ctx.fill();

  // волосы — шапка со стороны макушки
  ctx.fillStyle = hair;
  ctx.beginPath();
  ctx.arc(headCx - hx * headR * 0.15, headCy - hy * headR * 0.15, headR * 0.88, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.arc(headCx + hx * headR * 0.34, headCy + hy * headR * 0.34, headR * 0.78, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = 1;
}

// Сгорание линии может разрезать фигуру на несвязанные куски, поэтому группу
// делим на связные компоненты: обход от корня иначе не дойдёт до отрезанной
// клетки, и та пропадёт с экрана, оставаясь на поле.
function connectedComponents(cells) {
  const key = c => c[0] + ',' + c[1];
  const index = new Map(cells.map((c, i) => [key(c), i]));
  const seen = new Array(cells.length).fill(false);
  const comps = [];

  for (let s = 0; s < cells.length; s++) {
    if (seen[s]) continue;
    const stack = [s];
    seen[s] = true;
    const comp = [];
    while (stack.length) {
      const i = stack.pop();
      comp.push(cells[i]);
      const [x, y] = cells[i];
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
        const j = index.get((x + dx) + ',' + (y + dy));
        if (j !== undefined && !seen[j]) {
          seen[j] = true;
          stack.push(j);
        }
      });
    }
    comps.push(comp);
  }
  return comps;
}

// Застывшие фигуры: клетки с одинаковой меткой собираем обратно в одно тело.
function drawLocked(ctx, board, pids) {
  const groups = new Map();
  board.forEach((row, y) => row.forEach((kind, x) => {
    if (!kind) return;
    const pid = pids?.[y]?.[x] ?? 0;
    const gkey = pid || `k${kind}-${x}-${y}`;
    if (!groups.has(gkey)) groups.set(gkey, { kind, cells: [] });
    groups.get(gkey).cells.push([x, y]);
  }));
  groups.forEach(({ kind, cells }) => {
    connectedComponents(cells).forEach(part => {
      drawBody(ctx, part, CELL, COLORS[kind], 1, kind + part.length, [0, 300]);
    });
  });
}

function drawPreview(ctx, view) {
  ctx.clearRect(0, 0, 120, 90);
  if (!view) return;
  const size = 20;
  const cells = view.cells;
  const minX = Math.min(...cells.map(c => c[0]));
  const minY = Math.min(...cells.map(c => c[1]));
  const maxX = Math.max(...cells.map(c => c[0])) + 1;
  const maxY = Math.max(...cells.map(c => c[1])) + 1;
  const norm = cells.map(([x, y]) => [x - minX, y - minY]);
  ctx.save();
  ctx.translate((120 - (maxX - minX) * size) / 2, (90 - (maxY - minY) * size) / 2);
  drawBody(ctx, norm, size, COLORS[view.kind], 1, view.kind, [0, (maxX - minX) * size]);
  ctx.restore();
}

function render() {
  const ctx = boardCtx;
  ctx.clearRect(0, 0, 300, 600);
  if (!state) return;

  // сетка поля, чтобы ряды читались
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 10; i++) {
    ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, 600); ctx.stroke();
  }
  for (let j = 1; j < 20; j++) {
    ctx.beginPath(); ctx.moveTo(0, j * CELL); ctx.lineTo(300, j * CELL); ctx.stroke();
  }

  // застывшие фигуры — по одному телу на фигуру
  drawLocked(ctx, state.board, state.pids);

  // призрак — куда фигура упадёт
  const ghostCells = state.ghost.cells.filter(([, y]) => y >= 0);
  if (ghostCells.length) drawBody(ctx, ghostCells, CELL, COLORS[state.ghost.kind], 0.22, state.ghost.kind, [0, 300]);

  // текущая фигура — одно тело
  const curCells = state.piece.cells.filter(([, y]) => y >= 0);
  if (curCells.length) drawBody(ctx, curCells, CELL, COLORS[state.piece.kind], 1, state.piece.kind, [0, 300]);

  if (state.over) {
    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, 300, 600);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 28px system-ui, sans-serif';
    ctx.fillText('GAME OVER', 150, 290);
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText('R — новая игра', 150, 320);
  }

  drawPreview(holdCtx, state.hold);
  drawPreview(nextCtx, state.next);
  $('score').textContent = state.score;
  $('lines').textContent = state.lines;
  $('level').textContent = state.level;
}

const KEY_ACTIONS = {
  ArrowLeft: 'left',
  ArrowRight: 'right',
  ArrowDown: 'soft',
  ArrowUp: 'rotate',
  KeyX: 'rotate',
  Space: 'hard',
  KeyC: 'hold',
  ShiftLeft: 'hold',
};
const REPEATABLE = new Set(['left', 'right', 'soft']);

document.addEventListener('keydown', e => {
  if (e.code === 'KeyR') {
    if (!e.repeat) send({ type: 'restart' });
    return;
  }
  const action = KEY_ACTIONS[e.code];
  if (!action) return;
  e.preventDefault();
  if (e.repeat && !REPEATABLE.has(action)) return;
  send({ type: 'input', action });
});

function send(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);
  ws.onopen = () => { $('status').textContent = 'в игре'; };
  ws.onmessage = e => { state = JSON.parse(e.data); render(); };
  ws.onclose = () => {
    $('status').textContent = 'нет связи, переподключаюсь…';
    setTimeout(connect, 1000);
  };
}

connect();
</script>
</body>
</html>
